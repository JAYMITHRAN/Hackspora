name: Build and Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter ai-careerpath-frontend run lint

      - name: Build frontend
        run: pnpm --filter ai-careerpath-frontend run build

      - name: Backend syntax check
        run: pnpm --filter ai-careerpath-backend exec node --check index.js

      - name: Package backend source
        run: |
          tar -czf backend-source.tar.gz -C apps/backend .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-next-build
          path: |
            apps/frontend/.next
            apps/frontend/package.json
            apps/frontend/next.config.mjs
            apps/frontend/public
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: backend-source.tar.gz
          if-no-files-found: error
          retention-days: 7
