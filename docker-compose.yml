services:
  ollama:
    image: ollama/ollama:latest
    container_name: hackspora-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        ollama serve &
        server_pid=$$!
        trap 'kill $$server_pid' INT TERM
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done
        if ! ollama list | grep -q "^$$OLLAMA_MODEL[[:space:]]"; then
          ollama pull "$$OLLAMA_MODEL"
        fi
        wait $$server_pid
    healthcheck:
      test: [ "CMD-SHELL", "ollama list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: hackspora-llm
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_HTTP_TIMEOUT: ${LLM_HTTP_TIMEOUT:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-0.5}
    ports:
      - "11435:11435"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:11435/health').read()\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hackspora-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      LLM_SERVICE_BASE_URL: http://llm:11435
    ports:
      - "5001:5000"
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3002}
    container_name: hackspora-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3002}
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama-data:
